<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" fill="none">
  <defs>
    <clipPath id="arch"><path d="M120 300a200 200 0 0 1 400 0v230a20 20 0 0 1-20 20H140a20 20 0 0 1-20-20z"/></clipPath>
  </defs>
  <!-- arched window backdrop -->
  <path d="M120 300a200 200 0 0 1 400 0v230a20 20 0 0 1-20 20H140a20 20 0 0 1-20-20z" fill="#F0D9A8"/>
  <g clip-path="url(#arch)">
    <!-- sky -->
    <rect x="110" y="90" width="420" height="470" fill="#EBC98A"/>
    <!-- sun -->
    <g>
      <g stroke="#C65B3C" stroke-width="10" stroke-linecap="round">
        <line x1="320" y1="150" x2="320" y2="100"/>
        <line x1="260" y1="165" x2="238" y2="122"/>
        <line x1="380" y1="165" x2="402" y2="122"/>
        <line x1="222" y1="205" x2="185" y2="178"/>
        <line x1="418" y1="205" x2="455" y2="178"/>
      </g>
      <circle cx="320" cy="228" r="62" fill="#E3A32C"/>
      <circle cx="320" cy="228" r="62" fill="none" stroke="#C65B3C" stroke-width="6"/>
    </g>
    <!-- rolling hills -->
    <path d="M110 470c70-60 150-60 210-20s150 40 210-14v124H110z" fill="#7C8A3B"/>
    <path d="M110 512c80-46 150-30 220 2s150 24 200-16v66H110z" fill="#3C7E7C"/>
  </g>
  <!-- arch frame -->
  <path d="M120 300a200 200 0 0 1 400 0v230a20 20 0 0 1-20 20H140a20 20 0 0 1-20-20z" fill="none" stroke="#3A2417" stroke-width="7"/>

  <!-- counter -->
  <rect x="70" y="548" width="500" height="20" rx="10" fill="#C65B3C"/>

  <!-- coffee cup -->
  <g transform="translate(150 470)">
    <path d="M8 60c8-4 6-14 4-22" stroke="#EFE0BE" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M22 60c8-4 6-14 4-22" stroke="#EFE0BE" stroke-width="6" stroke-linecap="round" fill="none"/>
    <rect x="-16" y="52" width="78" height="46" rx="12" fill="#F4E8D0" stroke="#3A2417" stroke-width="5"/>
    <path d="M62 60h10a14 14 0 0 1 0 28H62" fill="none" stroke="#3A2417" stroke-width="5"/>
    <rect x="-24" y="94" width="94" height="10" rx="5" fill="#DB8E6B" stroke="#3A2417" stroke-width="4"/>
  </g>

  <!-- cocktail -->
  <g transform="translate(300 452)">
    <path d="M0 6h74L44 58v40" stroke="#3A2417" stroke-width="5" fill="#DB8E6B" stroke-linjoin="round"/>
    <path d="M8 12h58L40 50z" fill="#C65B3C"/>
