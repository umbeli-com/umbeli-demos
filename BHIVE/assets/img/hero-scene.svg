    <circle cx="60" cy="20" r="7" fill="#A8452B" stroke="#3A2417" stroke-width="3"/>
    <line x1="60" y1="13" x2="52" y2="2" stroke="#7C8A3B" stroke-width="3"/>
  </g>

  <!-- vinyl record -->
  <g transform="translate(430 452)">
    <circle cx="45" cy="55" r="52" fill="#3A2417"/>
    <circle cx="45" cy="55" r="52" fill="none" stroke="#5C3A24" stroke-width="2"/>
    <circle cx="45" cy="55" r="38" fill="none" stroke="#6E4C6B" stroke-width="2"/>
    <circle cx="45" cy="55" r="20" fill="#E3A32C"/>
    <circle cx="45" cy="55" r="4" fill="#3A2417"/>
  </g>

  <!-- little plant -->
  <g transform="translate(70 452)">
    <path d="M30 96V60" stroke="#7C8A3B" stroke-width="5"/>
    <path d="M30 66C10 60 6 40 6 30c18 2 26 20 24 36z" fill="#7C8A3B"/>
    <path d="M30 60c20-8 24-30 24-42-18 4-26 24-24 42z" fill="#3C7E7C"/>
    <path d="M30 54c2-16 16-24 24-26-2 16-10 24-24 26z" fill="#7C8A3B"/>
    <path d="M12 92h36l-4 24a6 6 0 0 1-6 6H22a6 6 0 0 1-6-6z" fill="#C65B3C" stroke="#3A2417" stroke-width="4"/>
  </g>

  <!-- moon + stars -->
  <path d="M470 150a26 26 0 1 0 8 34 20 20 0 0 1-8-34z" fill="#F4E8D0" stroke="#3A2417" stroke-width="4"/>
  <g fill="#F4E8D0" stroke="#3A2417" stroke-width="2">
    <path d="M180 150l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>
    <path d="M420 250l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>
