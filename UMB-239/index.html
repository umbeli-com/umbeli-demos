                margin: 0 auto;

            .umbeli-brand {
                display: flex;
                flex-direction: column;
                align-items: center;
                margin-bottom: 32px;
                gap: 8px;
            }

            .umbeli-brand__logo {
                font-family: "Poppins", sans-serif;
                font-weight: 700;
                font-size: 2rem;
                color: var(--umbeli-light);
                letter-spacing: -0.02em;
            }

            .umbeli-brand__tagline {
                font-size: 0.75rem;
                font-weight: 400;
                color: rgba(255, 255, 255, 0.7);
                text-transform: uppercase;
                letter-spacing: 0.18em;
            }

            .staticrypt-form {
                background: var(--umbeli-white);
                color: #1a1a1a;
                border-radius: 16px;
                padding: 32px 28px;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            }

            .staticrypt-instructions {
                text-align: center;
                margin-bottom: 20px;
            }

            .staticrypt-title {
                font-size: 1.25rem;
                font-weight: 600;
                color: var(--umbeli-dark);
                margin: 0 0 8px 0;
            }

            .staticrypt-instructions p:not(.staticrypt-title) {
                color: var(--umbeli-grey);
                font-size: 0.875rem;
                line-height: 1.5;
                margin: 0;
            }

            .staticrypt-hr { display: none; }

            .staticrypt-password-container {
                position: relative;
                background: var(--umbeli-grey-soft);
                border-radius: 10px;
                margin: 20px 0 16px 0;
                border: 2px solid transparent;
                transition: border-color 150ms ease;
            }

            .staticrypt-password-container:focus-within {
                border-color: var(--umbeli-dark);
                background: var(--umbeli-white);
            }

            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                background: transparent;
                border: 0;
                font-family: "Poppins", sans-serif;
                font-size: 15px;
                outline: 0;
                padding: 14px 44px 14px 16px;
                width: 100%;
                color: #1a1a1a;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 18px;
                width: 18px;
                opacity: 0.55;
                padding: 14px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
            }

            .staticrypt-toggle-password-visibility:hover { opacity: 0.85; }

            .staticrypt-form .staticrypt-decrypt-button {
                background: var(--umbeli-dark);
                width: 100%;
                border: 0;
                border-radius: 10px;
                padding: 14px;
                color: var(--umbeli-white);
                font-family: "Poppins", sans-serif;
                font-size: 0.95rem;
                font-weight: 600;
                letter-spacing: 0.02em;
                cursor: pointer;
                transition: background 150ms ease, transform 150ms ease;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover {
                background: var(--umbeli-darker);
                transform: translateY(-1px);
            }

            .staticrypt-form .staticrypt-decrypt-button:active {
                transform: translateY(0);
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                gap: 8px;
                margin: 0 0 16px 0;
                color: var(--umbeli-grey);
                font-size: 0.85rem;
            }

            .staticrypt-remember input[type="checkbox"] {
                accent-color: var(--umbeli-dark);
                transform: scale(1.2);
            }

            .umbeli-foot {
                text-align: center;
                margin-top: 28px;
                color: rgba(255, 255, 255, 0.55);
                font-size: 0.75rem;
            }

            .umbeli-foot a {
                color: var(--umbeli-light);
                text-decoration: none;
                font-weight: 500;
            }

            .umbeli-foot a:hover { text-decoration: underline; }

            .hidden { display: none !important; }

            .staticrypt-spinner-container {

                align-items: center;
                justify-content: center;

                height: 2rem;

                border-right-color: var(--umbeli-light);
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }

            @keyframes spinner-border {
                100% { transform: rotate(360deg); }
            }

            @media (max-width: 480px) {
                .staticrypt-form { padding: 24px 20px; }
                .umbeli-brand__logo { font-size: 1.65rem; }
            }
