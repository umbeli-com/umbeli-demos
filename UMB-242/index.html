<!DOCTYPE html>
<html class="staticrypt-html" lang="fr">
    <head>
        <meta charset="utf-8" />
        <title>Démonstration privée</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

        <style>
            :root {
                --u-navy: #030174;
                --u-navy-deep: #020155;
                --u-text: #111111;
                --u-text-soft: #6e6e6e;
                --u-text-dim: #9aa0ad;
                --u-border: #e4e7ef;
                --u-border-soft: #f1f2f6;
                --u-bg: #fcfcfd;
                --u-bg-form: #ffffff;
                --u-input-bg: #f7f8fb;
            }

            * { box-sizing: border-box; }

            .staticrypt-html, .staticrypt-body { height: 100%; margin: 0; }

            .staticrypt-content {
                min-height: 100%;
                margin: 0;
                font-family: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                background: var(--u-bg);
                color: var(--u-text);
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 32px 20px;
            }

            .staticrypt-page {
                width: 100%;
                max-width: 440px;
                margin: 0 auto;
            }

            .umbeli-brand {
                display: flex;
                flex-direction: column;
                align-items: center;
                margin-bottom: 28px;
                gap: 12px;
            }

            .umbeli-brand__logo {
                width: 160px;
                height: auto;
                display: block;
            }

            .umbeli-brand__tagline {
                font-size: 0.7rem;
                font-weight: 500;
                color: var(--u-text-dim);
                text-transform: uppercase;
                letter-spacing: 0.22em;
            }

            .staticrypt-form {
                background: var(--u-bg-form);
                color: var(--u-text);
                border: 1px solid var(--u-border);
                border-radius: 14px;
                padding: 32px 28px 28px;
                box-shadow: 0 1px 2px rgba(3, 1, 116, 0.04), 0 8px 24px rgba(3, 1, 116, 0.06);
            }

            .staticrypt-instructions {
                text-align: center;
                margin-bottom: 22px;
            }

            .staticrypt-title {
                font-size: 1.15rem;
                font-weight: 600;
                color: var(--u-navy);
                margin: 0 0 6px 0;
                letter-spacing: -0.01em;
            }

            .staticrypt-instructions p:not(.staticrypt-title) {
                color: var(--u-text-soft);
                font-size: 0.875rem;
                line-height: 1.55;
                margin: 0;
            }

            .staticrypt-hr { display: none; }

            .staticrypt-password-container {
                position: relative;
                background: var(--u-input-bg);
                border-radius: 10px;
                margin: 18px 0 14px 0;
                border: 1px solid var(--u-border-soft);
                transition: border-color 150ms ease, background 150ms ease;
            }

            .staticrypt-password-container:focus-within {
                border-color: var(--u-navy);
                background: var(--u-bg-form);
            }

            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                background: transparent;
                border: 0;
                font-family: "Poppins", sans-serif;
                font-size: 0.95rem;
                outline: 0;
                padding: 14px 44px 14px 16px;
                width: 100%;
                color: var(--u-text);
            }

            .staticrypt-form input::placeholder { color: var(--u-text-dim); }

            .staticrypt-toggle-password-visibility {
                background: transparent;
                border: 0;
                cursor: pointer;
                color: var(--u-navy);
                padding: 10px;
                position: absolute;
                right: 4px;
                top: 50%;
                transform: translateY(-50%);
                opacity: 0.75;
                transition: opacity 150ms ease;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                line-height: 0;
            }

            .staticrypt-toggle-password-visibility:hover,
            .staticrypt-toggle-password-visibility:focus-visible { opacity: 1; outline: 0; }
            .staticrypt-toggle-password-visibility svg { display: block; width: 22px; height: 22px; }

            .staticrypt-form .staticrypt-decrypt-button {
                background: var(--u-navy);
                width: 100%;
                border: 1px solid var(--u-navy);
                border-radius: 10px;
                padding: 13px;
                color: #ffffff;
                font-family: "Poppins", sans-serif;
                font-size: 0.9rem;
                font-weight: 600;
                letter-spacing: 0.01em;
                cursor: pointer;
                transition: background 150ms ease, transform 100ms ease;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover {
                background: var(--u-navy-deep);
                border-color: var(--u-navy-deep);
            }

            .staticrypt-form .staticrypt-decrypt-button:active {
                transform: scale(0.99);
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                gap: 8px;
                margin: 4px 0 16px 0;
                color: var(--u-text-soft);
                font-size: 0.85rem;
            }

            .staticrypt-remember input[type="checkbox"] {
                accent-color: var(--u-navy);
                transform: scale(1.1);
            }

            .umbeli-foot {
                text-align: center;
                margin-top: 24px;
                color: var(--u-text-dim);
                font-size: 0.72rem;
                line-height: 1.6;
            }

            .umbeli-foot a {
                color: var(--u-navy);
                text-decoration: none;
                font-weight: 500;
            }

            .umbeli-foot a:hover { text-decoration: underline; }

            .hidden { display: none !important; }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 1.75rem;
                height: 1.75rem;
                border: 0.22em solid var(--u-border);
                border-right-color: var(--u-navy);
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }

            @keyframes spinner-border {
                100% { transform: rotate(360deg); }
            }

            @media (max-width: 480px) {
                .staticrypt-form { padding: 24px 20px; }
                .umbeli-brand__logo { width: 130px; }
            }
        </style>
    </head>

            const svgEyeOff = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a18.51 18.51 0 0 1 4.21-5.04M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a18.51 18.51 0 0 1-2.05 2.94"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
            toggleIcon.addEventListener("click", function () {
                const passwordInput = document.getElementById("staticrypt-password");
                if (passwordInput.type === "password") {
                    passwordInput.type = "text";
                    toggleIcon.innerHTML = svgEyeOff;
                    toggleIcon.setAttribute("aria-label", templateToggleAltHide);
                    toggleIcon.title = templateToggleAltHide;
                } else {
                    passwordInput.type = "password";
                    toggleIcon.innerHTML = svgEye;
                    toggleIcon.setAttribute("aria-label", templateToggleAltShow);
                    toggleIcon.title = templateToggleAltShow;
                }
                passwordInput.focus();
            });

            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();
                const password = document.getElementById("staticrypt-password").value,
                    isRememberChecked = document.getElementById("staticrypt-remember").checked;
                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);
                if (!isSuccessful) {
                    alert(templateError);
                }
            });
        </script>
    </body>
</html>
